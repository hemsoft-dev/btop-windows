name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  linux-x64:
    name: Linux x64 (fmt, clippy, workspace tests, btop-fleet smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test workspace
        run: cargo test --workspace
      - name: Run 200x60 render+diff performance budget (release)
        run: cargo test --release -p btop-ui --test perf_budget -- --ignored --nocapture
      - name: Build btop-fleet and run CLI smoke checks
        run: |
          cargo build -p btop-fleet-cli
          ./target/debug/btop-fleet --version
          ./target/debug/btop-fleet --default-config > /dev/null
          ./target/debug/btop-fleet --schema > /dev/null
          ./target/debug/btop-fleet --json --diagnose --replay fixtures/win11-16core-dual-gpu-desktop.jsonl > /dev/null

  macos-arm64:
    name: macOS arm64 (clippy, workspace tests, btop-fleet smoke)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test workspace
        run: cargo test --workspace
      - name: Build btop-fleet and run CLI smoke checks
        run: |
          cargo build -p btop-fleet-cli
          ./target/debug/btop-fleet --version
          ./target/debug/btop-fleet --default-config > /dev/null
          ./target/debug/btop-fleet --schema > /dev/null
          ./target/debug/btop-fleet --json --diagnose --replay fixtures/win11-16core-dual-gpu-desktop.jsonl > /dev/null

  windows-x64:
    name: Windows 11 x64 (fmt, clippy, tests, CLI smoke)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test workspace (including live Windows 11 telemetry invariants)
        run: cargo test --workspace
      - name: Run 200x60 render+diff performance budget (release)
        run: cargo test --release -p btop-ui --test perf_budget -- --ignored --nocapture
      - name: Run live Windows 11 self-overhead RSS and CPU budget (release)
        run: cargo test --release -p btop-windows --test live_budgets -- --ignored --nocapture
      - name: Build binary and run CLI smoke checks
        shell: pwsh
        run: |
          cargo build -p btop-windows --target x86_64-pc-windows-msvc
          .\target\x86_64-pc-windows-msvc\debug\btop.exe --version
          .\target\x86_64-pc-windows-msvc\debug\btop.exe --default-config | Out-Null
          .\target\x86_64-pc-windows-msvc\debug\btop.exe --schema | Out-Null
