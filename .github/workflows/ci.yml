name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  linux-portable:
    name: Linux portable check (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy portable crates
        run: cargo clippy -p btop-model -p btop-config -p btop-collect -p btop-term -p btop-ui --all-targets -- -D warnings
      - name: Test portable crates
        run: cargo test -p btop-model -p btop-config -p btop-collect -p btop-term -p btop-ui
      - name: Run 200x60 render+diff performance budget (release)
        run: cargo test --release -p btop-ui --test perf_budget -- --ignored --nocapture

  windows-x64:
    name: Windows 11 x64 (fmt, clippy, tests, CLI smoke)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test workspace (including live Windows 11 telemetry invariants)
        run: cargo test --workspace
      - name: Run 200x60 render+diff performance budget (release)
        run: cargo test --release -p btop-ui --test perf_budget -- --ignored --nocapture
      - name: Run live Windows 11 self-overhead RSS and CPU budget (release)
        run: cargo test --release -p btop-windows --test live_budgets -- --ignored --nocapture
      - name: Build binary and run CLI smoke checks
        shell: pwsh
        run: |
          cargo build -p btop-windows --target x86_64-pc-windows-msvc
          .\target\x86_64-pc-windows-msvc\debug\btop-windows.exe --version
          .\target\x86_64-pc-windows-msvc\debug\btop-windows.exe --default-config | Out-Null
