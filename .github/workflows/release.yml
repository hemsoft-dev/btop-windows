name: Release (Windows 11 x64)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version label for dry-run packaging (does not publish a GitHub Release)"
        required: false
        default: "v0.1.0-dry-run"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: "-C target-feature=+crt-static"

jobs:
  release-windows-x64:
    name: Build, audit PE imports, and package Windows 11 x64
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain (x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Resolve release tag and archive names
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          $tag = if ($env:EVENT_NAME -eq 'push') { $env:REF_NAME } else { $env:DISPATCH_TAG }
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = 'v0.1.0-dry-run'
          }
          if ($tag -notmatch '^v[0-9A-Za-z._-]+$') {
            throw "Invalid release tag format '$tag'. Expected pattern '^v[0-9A-Za-z._-]+$'."
          }
          $archiveName = "btop-windows-$tag-x86_64-windows.zip"
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ARCHIVE_NAME=$archiveName" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Release tag: $tag"
          Write-Host "Archive name: $archiveName"

      - name: Build static-CRT release binary (x86_64-pc-windows-msvc)
        shell: pwsh
        run: |
          cargo build --release --locked -p btop-windows --target x86_64-pc-windows-msvc

      - name: Audit PE imports (confirm +crt-static and Windows system DLLs only)
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/check-pe-imports.ps1 -BinaryPath target/x86_64-pc-windows-msvc/release/btop.exe

      - name: Smoke test release binary
        shell: pwsh
        run: |
          $exe = "target/x86_64-pc-windows-msvc/release/btop.exe"
          & $exe --version
          & $exe --help | Out-Null
          & $exe --default-config | Out-Null

      - name: Package portable zip archive and SHA256SUMS.txt
        shell: pwsh
        run: |
          $stage = Join-Path $PWD "dist/stage"
          $dist = Join-Path $PWD "dist"
          if (Test-Path -LiteralPath $dist) {
            Remove-Item -LiteralPath $dist -Recurse -Force
          }
          New-Item -ItemType Directory -Path (Join-Path $stage "themes") -Force | Out-Null

          Copy-Item -LiteralPath "target/x86_64-pc-windows-msvc/release/btop.exe" -Destination $stage
          Copy-Item -LiteralPath "LICENSE" -Destination $stage
          Copy-Item -LiteralPath "NOTICE" -Destination $stage
          Copy-Item -LiteralPath "README.md" -Destination $stage
          Copy-Item -Path "themes/*.theme" -Destination (Join-Path $stage "themes")

          $archivePath = Join-Path $dist $env:ARCHIVE_NAME
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $archivePath -CompressionLevel Optimal

          $hash = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumLine = "$hash  $env:ARCHIVE_NAME"
          $checksumPath = Join-Path $dist "SHA256SUMS.txt"
          Set-Content -LiteralPath $checksumPath -Value $checksumLine -Encoding utf8NoBOM

          Write-Host "Packaged archive: $archivePath"
          Write-Host "SHA256SUMS.txt: $checksumLine"

          # Verify extracted archive contains every expected release file.
          $verifyDir = Join-Path $dist "verify"
          Expand-Archive -LiteralPath $archivePath -DestinationPath $verifyDir -Force
          $required = @("btop.exe", "LICENSE", "NOTICE", "README.md")
          foreach ($item in $required) {
            if (-not (Test-Path -LiteralPath (Join-Path $verifyDir $item) -PathType Leaf)) {
              throw "Missing required release file in zip: $item"
            }
          }
          $themeCount = (Get-ChildItem -Path (Join-Path $verifyDir "themes") -Filter "*.theme").Count
          if ($themeCount -lt 1) {
            throw "Bundled themes/ directory is empty inside release archive"
          }
          Write-Host "Verified extracted archive ($themeCount themes) and running extracted --version:"
          & (Join-Path $verifyDir "btop.exe") --version

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: btop-windows-x86_64-windows
          path: |
            dist/${{ env.ARCHIVE_NAME }}
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release (tagged pushes only)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ghArgs = @(
            "release", "create", $env:RELEASE_TAG,
            "dist/$env:ARCHIVE_NAME",
            "dist/SHA256SUMS.txt",
            "--verify-tag",
            "--title", "btop-windows $env:RELEASE_TAG",
            "--generate-notes"
          )
          if ($env:RELEASE_TAG -match '-') {
            $ghArgs += "--prerelease"
          }
          gh @ghArgs
